openapi: 3.1.0
info:
  title: Drew's Pantry API
  version: 2.0.0
  description: Private Supabase-backed pantry operations. Read current state before mutations.
servers:
  - url: https://xaetuqdtnolzspfvqvja.supabase.co/functions/v1/pantry-api
security:
  - bearerAuth: []
paths:
  /v1/inventory:
    get:
      operationId: getPantryInventory
      summary: Read positive inventory lots with canonical food and product IDs
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      operationId: reconcilePantryInventory
      summary: Atomically replace live lots for selected foods using auditable adjustments
      x-openai-isConsequential: true
      requestBody: {$ref: '#/components/requestBodies/InventoryReconciliation'}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/Invalid'}}
  /v1/foods:
    get:
      operationId: findPantryFoods
      summary: Find canonical foods, supported units, nutrition, and products
      parameters:
        - {in: query, name: q, required: false, schema: {type: string}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      operationId: saveFoodDefinition
      summary: Create or update a canonical food
      x-openai-isConsequential: true
      requestBody: {$ref: '#/components/requestBodies/Food'}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/Invalid'}}
  /v1/foods/{id}:
    get:
      operationId: getPantryFood
      summary: Read one canonical food and its products
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}}
  /v1/products:
    post:
      operationId: saveProductDefinition
      summary: Create or update a purchasable product mapped to a canonical food
      x-openai-isConsequential: true
      requestBody: {$ref: '#/components/requestBodies/Product'}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/Invalid'}}
  /v1/groceries:
    post:
      operationId: addGroceryHaul
      summary: Atomically add reviewed product lots to inventory
      x-openai-isConsequential: true
      requestBody: {$ref: '#/components/requestBodies/GroceryHaul'}
      responses: {'201': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/Invalid'}}
  /v1/recipes:
    get:
      operationId: findRecipes
      summary: Find recipes with resolved ingredients and units
      parameters:
        - {in: query, name: q, required: false, schema: {type: string}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      operationId: saveRecipe
      summary: Atomically create or update a recipe and all ingredients
      x-openai-isConsequential: true
      requestBody: {$ref: '#/components/requestBodies/Recipe'}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/Invalid'}}
  /v1/recipes/{id}:
    get:
      operationId: getRecipe
      summary: Read one recipe
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}, '404': {$ref: '#/components/responses/NotFound'}}
  /v1/prepare/recipe:
    post:
      operationId: prepareSavedRecipe
      summary: Atomically deduct ingredients and create a prepared recipe batch
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipeId, servings]
              properties:
                recipeId: {type: string, format: uuid}
                servings: {type: number, exclusiveMinimum: 0}
                location: {type: string, enum: [fridge, freezer]}
                bestBy: {type: string, format: date}
                note: {type: string}
      responses: {'201': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/Invalid'}}
  /v1/prepared-batches:
    get:
      operationId: getPreparedFoods
      summary: Read prepared recipe batches with servings remaining
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /v1/consume/prepared:
    post:
      operationId: consumePreparedFood
      summary: Atomically consume a prepared batch and log nutrition
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [batchId, servings]
              properties:
                batchId: {type: string, format: uuid}
                servings: {type: number, exclusiveMinimum: 0}
                timestamp: {type: string, format: date-time}
                label: {type: string}
                note: {type: string}
      responses: {'201': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/Invalid'}}
  /v1/consume/inventory:
    post:
      operationId: consumePantryItem
      summary: Atomically deduct one food FEFO and log nutrition
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [foodId, quantity, unit]
              properties:
                foodId: {type: string, format: uuid}
                quantity: {type: number, exclusiveMinimum: 0}
                unit: {type: string, description: Unit UUID, full name, or short name from food lookup.}
                timestamp: {type: string, format: date-time}
                label: {type: string}
                note: {type: string}
      responses: {'201': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/Invalid'}}
  /v1/external-foods:
    get:
      operationId: searchOutsideFoods
      summary: Search reusable restaurant and packaged outside foods
      parameters:
        - {in: query, name: q, required: false, schema: {type: string}}
        - {in: query, name: brand, required: false, schema: {type: string}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      operationId: saveOutsideFood
      summary: Save or update a reusable outside food
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, calories, proteinG, carbsG, fatG, fiberG, sugarG, sodiumMg]
              properties:
                id: {type: string, format: uuid}
                name: {type: string, minLength: 1}
                brand: {type: string}
                barcode: {type: string}
                emoji: {type: string}
                calories: {type: number, minimum: 0}
                proteinG: {type: number, minimum: 0}
                carbsG: {type: number, minimum: 0}
                fatG: {type: number, minimum: 0}
                fiberG: {type: number, minimum: 0}
                sugarG: {type: number, minimum: 0}
                sodiumMg: {type: number, minimum: 0}
                source: {type: string}
                estimated: {type: boolean}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/Invalid'}}
  /v1/meals:
    post:
      operationId: logMealWithoutInventoryDeduction
      summary: Log one outside or custom food without changing inventory
      x-openai-isConsequential: true
      requestBody: {$ref: '#/components/requestBodies/MealLog'}
      responses: {'201': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/Invalid'}}
  /v1/history:
    get:
      operationId: getMealHistory
      summary: Read recent non-voided nutrition history
      parameters:
        - {in: query, name: days, required: false, schema: {type: integer, minimum: 1, maximum: 365, default: 30}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /v1/plans:
    get:
      operationId: getMealPlanAndGroceries
      summary: Read meal plans and the current grocery list
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      operationId: replaceWeeklyMealPlan
      summary: Atomically replace seven days and rebuild generated groceries
      x-openai-isConsequential: true
      requestBody: {$ref: '#/components/requestBodies/WeeklyPlan'}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/Invalid'}}
  /v1/grocery-items:
    post:
      operationId: addManualGroceryItem
      summary: Add one durable manual grocery item
      x-openai-isConsequential: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties: {name: {type: string}, quantityLabel: {type: string}, note: {type: string}}
      responses: {'201': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/Invalid'}}
  /v1/targets:
    get:
      operationId: getNutritionTargets
      summary: Read nutrition targets
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      operationId: saveNutritionTargets
      summary: Replace nutrition targets
      x-openai-isConsequential: true
      requestBody: {$ref: '#/components/requestBodies/Targets'}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/Invalid'}}
  /v1/preferences:
    get:
      operationId: getFoodPreferences
      summary: Read allergies and food preferences
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      operationId: saveFoodPreferences
      summary: Replace allergies and food preferences
      x-openai-isConsequential: true
      requestBody: {$ref: '#/components/requestBodies/Preferences'}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/Invalid'}}
  /v1/routine:
    get:
      operationId: getPersonalRoutine
      summary: Read routine and meal-planning availability
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}}
    post:
      operationId: savePersonalRoutine
      summary: Replace routine and meal-planning availability
      x-openai-isConsequential: true
      requestBody: {$ref: '#/components/requestBodies/Routine'}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/Invalid'}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  responses:
    Success:
      description: Operation completed
      content: {application/json: {schema: {type: object, additionalProperties: true}}}
    Unauthorized:
      description: Bearer token is missing or invalid
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    Invalid:
      description: Validation failed and the transaction was rolled back
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    NotFound:
      description: Resource not found
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  requestBodies:
    Food: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Food'}}}}
    Product: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}}
    GroceryHaul: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/GroceryHaul'}}}}
    InventoryReconciliation: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/InventoryReconciliation'}}}}
    Recipe: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Recipe'}}}}
    MealLog: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MealLog'}}}}
    WeeklyPlan: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WeeklyPlan'}}}}
    Targets: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Targets'}}}}
    Preferences: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Preferences'}}}}
    Routine: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Routine'}}}}
  schemas:
    Error:
      type: object
      required: [error]
      properties: {error: {type: string}}
    Nutrition:
      type: object
      additionalProperties: false
      required: [basisQuantity, calories, proteinG, carbsG, fatG, fiberG, sugarG, sodiumMg]
      properties:
        basisQuantity: {type: number, exclusiveMinimum: 0}
        calories: {type: number, minimum: 0}
        proteinG: {type: number, minimum: 0}
        carbsG: {type: number, minimum: 0}
        fatG: {type: number, minimum: 0}
        fiberG: {type: number, minimum: 0}
        sugarG: {type: number, minimum: 0}
        sodiumMg: {type: number, minimum: 0}
        source: {type: string}
        estimated: {type: boolean}
    Food:
      type: object
      additionalProperties: false
      required: [name, measureStyle, displayUnit]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        plural: {type: string}
        emoji: {type: string}
        measureStyle: {type: string, enum: [discrete, weight, volume]}
        displayUnit: {type: string, description: Unit UUID, full name, or short name.}
        groceryCategory: {type: string}
        ingredientRole: {type: string, enum: [main, supporting, staple]}
        storeAisle: {type: string}
        gPerFlOz: {type: number, exclusiveMinimum: 0}
        gPerCount: {type: number, exclusiveMinimum: 0}
        aliases: {type: array, items: {type: string}}
        nutrition: {$ref: '#/components/schemas/Nutrition'}
    Product:
      type: object
      additionalProperties: false
      required: [foodId, name, packageQuantity, packageUnit]
      properties:
        id: {type: string, format: uuid}
        foodId: {type: string, format: uuid}
        name: {type: string}
        brand: {type: string}
        barcode: {type: string}
        aliases: {type: array, items: {type: string}}
        packageQuantity: {type: number, exclusiveMinimum: 0}
        packageUnit: {type: string}
        servingQuantity: {type: number, exclusiveMinimum: 0}
        nutrition: {$ref: '#/components/schemas/Nutrition'}
    GroceryLot:
      type: object
      additionalProperties: false
      required: [productId, quantity, unit]
      properties:
        productId: {type: string, format: uuid}
        quantity: {type: number, exclusiveMinimum: 0}
        unit: {type: string}
        location: {type: string, enum: [pantry, fridge, freezer]}
        bestBy: {type: string, format: date}
        totalCost: {type: number, minimum: 0}
        costIsEstimated: {type: boolean}
        note: {type: string}
    GroceryHaul:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        source: {type: string}
        items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/GroceryLot'}}
    InventoryReconciliation:
      type: object
      additionalProperties: false
      required: [replacements]
      properties:
        source: {type: string}
        replacements:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [foodId, lots]
            properties:
              foodId: {type: string, format: uuid}
              lots: {type: array, items: {$ref: '#/components/schemas/GroceryLot'}}
    Recipe:
      type: object
      additionalProperties: false
      required: [name, servings, ingredients]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        emoji: {type: string}
        servings: {type: number, exclusiveMinimum: 0}
        sourceUrl: {type: string, format: uri}
        sourceNote: {type: string}
        promptForFeedback: {type: boolean}
        nutrition:
          allOf:
            - {$ref: '#/components/schemas/Nutrition'}
          description: Whole-recipe totals; basisQuantity is ignored and may equal servings.
        instructions: {type: array, items: {type: string}}
        portions: {type: array, items: {type: object, additionalProperties: true}}
        preparationRules: {type: array, items: {type: object, additionalProperties: true}}
        ingredients:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [foodId, quantity, unit]
            properties:
              foodId: {type: string, format: uuid}
              quantity: {type: number, exclusiveMinimum: 0}
              unit: {type: string}
              sortOrder: {type: integer, minimum: 0}
              note: {type: string}
    MealLog:
      type: object
      additionalProperties: false
      properties:
        externalFoodId: {type: string, format: uuid}
        servings: {type: number, exclusiveMinimum: 0}
        label: {type: string}
        calories: {type: number, minimum: 0}
        proteinG: {type: number, minimum: 0}
        carbsG: {type: number, minimum: 0}
        fatG: {type: number, minimum: 0}
        fiberG: {type: number, minimum: 0}
        sugarG: {type: number, minimum: 0}
        sodiumMg: {type: number, minimum: 0}
        estimated: {type: boolean}
        timestamp: {type: string, format: date-time}
        note: {type: string}
    WeeklyPlan:
      type: object
      additionalProperties: false
      required: [weekStart, entries]
      properties:
        weekStart: {type: string, format: date}
        entries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [date, slot, source, sourceId, scaleFactor]
            properties:
              date: {type: string, format: date}
              slot: {type: string, enum: [breakfast, brunch, lunch, dinner, snack, dessert]}
              source: {type: string, enum: [recipe, meal]}
              sourceId: {type: string, format: uuid}
              scaleFactor: {type: number, exclusiveMinimum: 0}
              scheduledTime: {type: string}
              groupId: {type: string}
              leftoverOfGroupId: {type: string}
              intent: {type: string, enum: [prepare, leftover]}
              name: {type: string}
              emoji: {type: string}
              preparationTasks: {type: array, items: {type: object, additionalProperties: true}}
              note: {type: string}
    Targets:
      type: object
      additionalProperties: false
      required: [calories, proteinG, carbsG, fatG, fiberG, sodiumMg]
      properties:
        calories: {type: number, exclusiveMinimum: 0}
        proteinG: {type: number, minimum: 0}
        carbsG: {type: number, minimum: 0}
        fatG: {type: number, minimum: 0}
        fiberG: {type: number, minimum: 0}
        sodiumMg: {type: number, minimum: 0}
        label: {type: string}
    Preferences:
      type: object
      additionalProperties: false
      properties:
        allergies: {type: array, items: {type: string}}
        dislikes: {type: array, items: {type: string}}
        favorites: {type: array, items: {type: string}}
        dietaryRules: {type: array, items: {type: string}}
        planningNotes: {type: string}
    Routine:
      type: object
      additionalProperties: false
      required: [timeZone, days, dinnerWindow, commuteMinutes, preparationBufferMinutes]
      properties:
        timeZone: {type: string}
        days: {type: object, additionalProperties: true}
        dinnerWindow:
          type: object
          additionalProperties: false
          required: [start, end]
          properties: {start: {type: string}, end: {type: string}}
        commuteMinutes: {type: integer, minimum: 0, maximum: 1440}
        preparationBufferMinutes: {type: integer, minimum: 0, maximum: 1440}
        defaultThawHours: {type: number, minimum: 0, maximum: 168}
        notes: {type: string}
