<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pantry_inventory">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>pantry_inventory</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Older Flutter builds registered an offline-first service worker. Retire
    // it before loading the current app so a Firefox home-screen shortcut
    // cannot keep serving an obsolete main.dart.js from its private cache.
    (async () => {
      const marker = '_pantry_sw_retired';
      const currentUrl = new URL(location.href);
      const alreadyRetired = currentUrl.searchParams.get(marker) === '1';
      if (alreadyRetired) {
        currentUrl.searchParams.delete(marker);
        history.replaceState(null, '', currentUrl);
      }

      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((item) => item.unregister()));
          if (
            registrations.length > 0 &&
            navigator.serviceWorker.controller &&
            !alreadyRetired
          ) {
            const reloadUrl = new URL(location.href);
            reloadUrl.searchParams.set(marker, '1');
            location.replace(reloadUrl);
            return;
          }
        }
      } catch (error) {
        console.warn('Unable to retire the legacy service worker.', error);
      }

      const bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js';
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })();
  </script>
</body>
</html>
