name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify
        run: |
          flutter analyze
          set +e
          flutter test --reporter expanded 2>&1 | tee flutter-test.log
          test_status=${PIPESTATUS[0]}
          set -e
          if [[ $test_status -ne 0 ]]; then
            failing_test="$(grep -E ' \[E\]$' flutter-test.log | tail -n 1 || true)"
            echo "::error title=Flutter test failure::${failing_test:-Flutter tests failed; inspect the job log.}"
            python3 - <<'PY'
          from pathlib import Path

          lines = Path("flutter-test.log").read_text(errors="replace").splitlines()
          markers = [
              index
              for index, line in enumerate(lines)
              if "EXCEPTION CAUGHT" in line or "TestFailure was thrown" in line
          ]
          if markers:
              detail = "\n".join(lines[markers[-1] : markers[-1] + 28])
              detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Flutter test details::{detail}")
          PY
            exit "$test_status"
          fi

      - name: Build web app
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == *.github.io ]]; then
            base_href="/"
          else
            base_href="/$repository_name/"
          fi
          flutter build web --release --base-href "$base_href" --pwa-strategy=none
          touch build/web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
